kind = "web"
  previewPath = "/"
  title = "Muhammad Imran Portfolio"
  version = "1.0.0"
  id = "artifacts/portfolio"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  name = "web"
  paths = [ "/" ]
  localPort = 21113

  [services.development]
  run = "pnpm --filter @workspace/portfolio run dev"

  [services.production]
  build = [ "pnpm", "--filter", "@workspace/portfolio", "run", "build" ]
  publicDir = "artifacts/portfolio/dist/public"
  serve = "static"

  [[services.production.rewrites]]
  from = "/index.html"
  to = "/index.html"

  [[services.production.rewrites]]
  from = "/about"
  to = "/about.html"
  [[services.production.rewrites]]
  from = "/about/"
  to = "/about.html"

  [[services.production.rewrites]]
  from = "/achievements"
  to = "/achievements.html"
  [[services.production.rewrites]]
  from = "/achievements/"
  to = "/achievements.html"

  [[services.production.rewrites]]
  from = "/projects"
  to = "/projects.html"
  [[services.production.rewrites]]
  from = "/projects/"
  to = "/projects.html"

  [[services.production.rewrites]]
  from = "/dashboard"
  to = "/dashboard.html"
  [[services.production.rewrites]]
  from = "/dashboard/"
  to = "/dashboard.html"

  [[services.production.rewrites]]
  from = "/contact"
  to = "/contact.html"
  [[services.production.rewrites]]
  from = "/contact/"
  to = "/contact.html"

  [[services.production.rewrites]]
  from = "/feedback"
