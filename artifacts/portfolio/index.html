        function showPrivacyMsg() {

            '<div>' +

            '</div>';
          document.body.appendChild(toast);
          requestAnimationFrame(function () { toast.style.opacity = '1'; });
          setTimeout(function () {
            toast.style.opacity = '0';
            setTimeout(function () { toast && toast.parentNode && toast.parentNode.removeChild(toast); }, 300);
          }, 3000);
        }

        document.addEventListener('keydown', function (e) {
          var key = e.key ? e.key.toLowerCase() : '';
          var ctrl = e.ctrlKey || e.metaKey;
          // Ctrl+U (view-source), Ctrl+I (inspect), Ctrl+Shift+I/J/C, F12
          if (
            (ctrl && key === 'u') ||
            (ctrl && key === 'i') ||
            (ctrl && e.shiftKey && (key === 'i' || key === 'j' || key === 'c')) ||
            e.key === 'F12'
          ) {
            e.preventDefault();
            e.stopPropagation();
            showPrivacyMsg();
            return false;
          }
        }, true);

        document.addEventListener('contextmenu', function (e) {
          e.preventDefault();
          showPrivacyMsg();
          return false;
        });
      })();
    </script>
